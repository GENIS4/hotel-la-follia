  rows.push([{ text: 'TOTAL A PERCEBRE', b: true, span: 4 }, { text: eur(t.total), b: true, al: 'right' }]); x += DX.table([1600, 4400, 900, 1000, 1500], rows);
  x += DX.para([['Total a percebre en lletres: ', { b: true }], euroText(t.total).toLowerCase() + '.'], { sa: 40 });
  x += DX.para([['Forma de pagament: ', { b: true }], d.formaPagament + (p.iban && /transfer/i.test(d.formaPagament) ? ' (IBAN ' + p.iban + ')' : '') + '.'], { sa: 160 });
  if (d.notes) x += DX.para(dietaText(d, d.notes), { al: 'both', sz: 20, sa: 300 });
  x += DX.table([5000, 5000], [[{ paras: ["Per l'associació,", '', '', '', a.representant, a.carrec || ''] }, { paras: ['Rebut i conforme, el perceptor,', '', '', '', p.nom, 'DNI/NIF ' + p.dni] }]], { noBorder: true });
  return DX.build(x, lb);
}

   6. ESTAT GLOBAL + SINCRONITZACIÓ AMB FIREBASE (Firestore)
   ===================================================================== */
const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

const FB_OK = !!(window.firebase && window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && !/ENGANXA|PASTE/.test(window.FIREBASE_CONFIG.apiKey));
if (FB_OK && !firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
const fdb = () => firebase.firestore();
const PRIV_FIELDS = ['dni', 'adreca', 'cp', 'poblacio', 'provincia', 'iban', 'telefon'];
const EDIT_ONLY = ['dietes', 'directori'];          // col·leccions que només veuen admin/editors
const clean = o => JSON.parse(JSON.stringify(o));   // Firestore no accepta «undefined»
const sig = o => canon(o);
const RO_MSG = '👀 Mode consulta: no tens permís per editar';

function useStore(role) {
  const [data, setData] = useState(EMPTY);
  const [ready, setReady] = useState(false);
  const [empty, setEmpty] = useState(false);
  const [sync, setSync] = useState('ok');            // ok | saving | error | offline
  const synced = useRef({ cols: {}, config: null, grup: null, galeria: {}, privat: {} });
  const remote = useRef({ musics: {}, privat: {} });
  const canEdit = role === 'admin' || role === 'editor';
  D = data;
  useEffect(() => { if (!ready || !canEdit) return; const r = reconcile(data); if (r !== data) setData(r); }, [data, ready]);

  // ---- Lectura en temps real
  useEffect(() => {
    if (!FB_OK || !role) return;
    const db = fdb(); const unsubs = []; const pending = new Set(['config', 'grup', ...LIST_KEYS.filter(k => canEdit || !EDIT_ONLY.includes(k))]);
    const done = k => { pending.delete(k); if (!pending.size) setReady(true); };
    const fail = k => e => { console.error(k, e); setSync('error'); done(k); };
    const rebuildMusics = () => Object.values(remote.current.musics).map(m => ({ ...m, ...(remote.current.privat[m.id] || {}) }));
    unsubs.push(db.doc('app/config').onSnapshot(s => {
      const c = s.exists ? s.data() : null; synced.current.config = c ? sig(c) : null;
      if (!c) setEmpty(true); else { setEmpty(false); setData(d => ({ ...d, config: normalize({ config: c }).config })); }
      done('config');
    }, fail('config')));
    unsubs.push(db.doc('app/grup').onSnapshot(s => {
      const g = s.exists ? s.data() : {}; synced.current.grup = sig(g);
      setData(d => ({ ...d, grup: { ...EMPTY().grup, ...g, galeria: d.grup.galeria || [] } })); done('grup');
    }, fail('grup')));
    unsubs.push(db.collection('galeria').onSnapshot(s => {
      const m = {}; const list = s.docs.map(x => { const o = { ...x.data(), id: x.id }; m[x.id] = sig(o); return o; }).sort((a, b) => (a.ordre || 0) - (b.ordre || 0));
      synced.current.galeria = m; setData(d => ({ ...d, grup: { ...d.grup, galeria: list } }));
    }, () => {}));
    LIST_KEYS.filter(k => canEdit || !EDIT_ONLY.includes(k)).forEach(k => {
      unsubs.push(db.collection(k).onSnapshot(s => {
        const m = {}; const list = s.docs.map(x => ({ ...x.data(), id: x.id }));
        if (k === 'musics') { remote.current.musics = {}; list.forEach(o => remote.current.musics[o.id] = o); const full = rebuildMusics(); full.forEach(o => m[o.id] = sig(o)); synced.current.cols[k] = m; setData(d => ({ ...d, musics: full })); }
        else { list.forEach(o => m[o.id] = sig(o)); synced.current.cols[k] = m; setData(d => ({ ...d, [k]: list })); }
        done(k);
      }, fail(k)));
    });
    if (canEdit) unsubs.push(db.collection('privat').onSnapshot(s => {
      remote.current.privat = {}; s.docs.forEach(x => remote.current.privat[x.id] = x.data());
      const full = rebuildMusics(); const m = {}; full.forEach(o => m[o.id] = sig(o)); synced.current.cols.musics = m; setData(d => ({ ...d, musics: full }));
    }, () => {}));
    const on = () => setSync(s => s === 'offline' ? 'ok' : s), off = () => setSync('offline');
    window.addEventListener('online', on); window.addEventListener('offline', off);
    return () => { unsubs.forEach(u => u()); window.removeEventListener('online', on); window.removeEventListener('offline', off); };
  }, [role]);

  // ---- Escriptura: només el que ha canviat respecte a l'últim estat del servidor
  useEffect(() => {
    if (!FB_OK || !ready || !canEdit) return;
    const db = fdb(); const ops = [];
    LIST_KEYS.filter(k => canEdit || !EDIT_ONLY.includes(k)).forEach(k => {
      const prev = synced.current.cols[k] || {}; const now = {};
      (data[k] || []).forEach(item => {
        const o = clean(item); now[o.id] = sig(o);
        if (prev[o.id] !== now[o.id]) {
          if (k === 'musics') { const pub = { ...o }, pri = {}; PRIV_FIELDS.forEach(f => { if (f in pub) { pri[f] = pub[f]; delete pub[f]; } }); delete pub.id; ops.push(b => b.set(db.collection('musics').doc(o.id), pub)); ops.push(b => b.set(db.collection('privat').doc(o.id), pri)); }
          else { const { id, ...rest } = o; ops.push(b => b.set(db.collection(k).doc(id), rest)); }
        }
      });
      Object.keys(prev).forEach(id => { if (!(id in now)) { ops.push(b => b.delete(db.collection(k).doc(id))); if (k === 'musics') ops.push(b => b.delete(db.collection('privat').doc(id))); } });
      synced.current.cols[k] = now;
    });
    const cfg = clean(data.config); if (sig(cfg) !== synced.current.config && !empty) { ops.push(b => b.set(db.doc('app/config'), cfg)); synced.current.config = sig(cfg); }
    const { galeria, ...gr } = clean(data.grup); if (sig(gr) !== synced.current.grup) { ops.push(b => b.set(db.doc('app/grup'), gr)); synced.current.grup = sig(gr); }
    const gprev = synced.current.galeria, gnow = {};
    (galeria || []).forEach((g, i) => { const o = { ...g, ordre: g.ordre ?? i }; gnow[o.id] = sig(o); if (gprev[o.id] !== gnow[o.id]) { const { id, ...rest } = o; ops.push(b => b.set(db.collection('galeria').doc(id), rest)); } });
    Object.keys(gprev).forEach(id => { if (!(id in gnow)) ops.push(b => b.delete(db.collection('galeria').doc(id))); });
    synced.current.galeria = gnow;
    if (!ops.length) return;
    setSync('saving');
    const chunks = []; for (let i = 0; i < ops.length; i += 400) chunks.push(ops.slice(i, i + 400));
    Promise.all(chunks.map(ch => { const b = db.batch(); ch.forEach(f => f(b)); return b.commit(); }))
      .then(() => setSync(navigator.onLine === false ? 'offline' : 'ok'))
      .catch(e => { console.error(e); setSync('error'); TOAST('No s’ha pogut desar: ' + (e.code === 'permission-denied' ? 'no tens permís' : (e.message || e.code)) + '. Si un document és molt gran (fotos o PDF), redueix-lo.'); });
  }, [data, ready]);

  const guard = fn => (...args) => { if (!canEdit) { TOAST(RO_MSG); window.__roAt = Date.now(); return; } fn(...args); };
  const update = guard((key, fn) => setData(d => ({ ...d, [key]: fn(d[key]) })));
  const upsert = guard((key, obj) => setData(d => ({ ...d, [key]: d[key].some(x => x.id === obj.id) ? d[key].map(x => x.id === obj.id ? obj : x) : [...d[key], obj] })));
  const remove = guard((key, id) => setData(d => ({ ...d, [key]: d[key].filter(x => x.id !== id) })));
  const patch = guard((key, id, changes) => setData(d => ({ ...d, [key]: d[key].map(x => x.id === id ? { ...x, ...(typeof changes === 'function' ? changes(x) : changes) } : x) })));
  const setConfig = guard(fn => setData(d => ({ ...d, config: fn(d.config) })));
  const setDataG = guard(fn => setData(fn));
  const replaceAll = guard(d => { setEmpty(false); setData(normalize(d)); });
  return { data, setData: setDataG, update, upsert, remove, patch, setConfig, replaceAll, ready, empty, sync, canEdit, downloads: null };
}

/* ---- Inici de sessió i membres ---- */
function useAuth() {
  const [st, setSt] = useState({ loading: true, user: null, role: null, denied: false });
  useEffect(() => {
    if (!FB_OK) { setSt({ loading: false, user: null, role: null }); return; }
    firebase.auth().getRedirectResult().catch(e => TOAST('Error en entrar: ' + (e.message || e.code)));
    return firebase.auth().onAuthStateChanged(async u => {
      if (!u) { setSt({ loading: false, user: null, role: null }); return; }
      const email = (u.email || '').toLowerCase();
      try {
        const s = await fdb().doc('membres/' + email).get();
        if (s.exists) setSt({ loading: false, user: u, role: s.data().rol || 'lector' });
        else {
          // El propietari (definit a les regles) pot entrar encara que no sigui a «membres»: provem si pot llegir la configuració.
          try { await fdb().doc('app/config').get(); await fdb().doc('membres/' + email).set({ rol: 'admin', nom: u.displayName || '', alta: todayISO() }); setSt({ loading: false, user: u, role: 'admin' }); }
          catch (e) { setSt({ loading: false, user: u, role: null, denied: true }); }
        }
      } catch (e) { setSt({ loading: false, user: u, role: null, denied: true }); }
    });
  }, []);
  return st;
}
const signIn = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); firebase.auth().signInWithPopup(p).catch(e => { if (/popup/.test(e.code || '')) firebase.auth().signInWithRedirect(p); else TOAST('No s’ha pogut entrar: ' + (e.message || e.code)); }); };
const signOut = () => firebase.auth().signOut();

.noclick{pointer-events:none}
.step{animation:stepb .36s ease-in-out infinite alternate}
@keyframes stepb{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.groove{animation:groove .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes groove{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-2px) rotate(2deg)}}
.leg-a,.leg-b,.arm-a,.arm-b,.kick,.strum,.pump,.mallet,.hit-a,.hit-b,.flag,.head-bob,.slide,.play,.type{transform-box:fill-box}
.leg-a{animation:legs .36s ease-in-out infinite alternate}
.leg-b{animation:legs .36s ease-in-out infinite alternate-reverse}
@keyframes legs{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
.arm-a{animation:arms .36s ease-in-out infinite alternate}
.arm-b{animation:arms .36s ease-in-out infinite alternate-reverse}
@keyframes arms{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.head-bob{animation:headb .5s ease-in-out infinite alternate}
@keyframes headb{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.play{animation:play .5s ease-in-out infinite alternate;transform-origin:0% 50%}
@keyframes play{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.slide{animation:slide .6s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(9px)}}
.mallet{animation:mallet .45s ease-in infinite alternate}
@keyframes mallet{from{transform:rotate(-35deg)}to{transform:rotate(10deg)}}
.strum{animation:strum .25s ease-in-out infinite alternate}
@keyframes strum{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.pump{animation:pump .5s ease-in-out infinite alternate}
@keyframes pump{from{transform:rotate(-18deg)}to{transform:rotate(14deg)}}
.hit-a{animation:hit .22s ease-in infinite alternate}
.hit-b{animation:hit .22s ease-in infinite alternate-reverse}
@keyframes hit{from{transform:rotate(-26deg)}to{transform:rotate(12deg)}}
.flag{animation:flagw .7s ease-in-out infinite alternate}
@keyframes flagw{from{transform:skewY(-6deg) scaleX(.92)}to{transform:skewY(6deg) scaleX(1)}}
.type{animation:typep .18s steps(2) infinite}
@keyframes typep{50%{transform:translateY(1.5px)}}
.kick{animation:kick 1.1s ease-in-out infinite;transform-origin:50% 0%}
@keyframes kick{0%,60%,100%{transform:rotate(0)}30%{transform:rotate(-55deg)}}
.ball{animation:ball 1.1s ease-in-out infinite}
@keyframes ball{0%,100%{transform:translate(0,0)}30%{transform:translate(4px,-46px)}60%{transform:translate(2px,-4px)}}
.parade{animation:parade 42s linear infinite}
@keyframes parade{from{transform:translateX(-140px)}to{transform:translateX(1500px)}}
.patrol{animation:patrol 14s linear infinite}
@keyframes patrol{0%{transform:translateX(0)}50%{transform:translateX(220px)}100%{transform:translateX(0)}}
.patrol-flip{animation:pflip 14s steps(1) infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pflip{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.note-up{animation:noteup 3s ease-out infinite}
@keyframes noteup{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(14px,-60px) rotate(18deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.parade,.patrol,.patrol-flip,.note-up,.step,.groove,.leg-a,.leg-b,.arm-a,.arm-b,.ball,.kick{animation:none}}

.hint{animation:hint 2s ease-in-out 3,hintout .8s ease 6s forwards!important}
@keyframes hintout{to{opacity:0;visibility:hidden}}

  const cells = []; for (let i = 0; i < offset; i++) cells.push(null); for (let d = 1; d <= days; d++) cells.push(d); while (cells.length % 7) cells.push(null);

    <div>

/* ---------- Estacions, temps i dia/nit (hora oficial de Madrid) ---------- */
const ESTACIONS = { primavera: { nom: 'Primavera', icon: '🌸' }, estiu: { nom: 'Estiu', icon: '☀️' }, tardor: { nom: 'Tardor', icon: '🍂' }, hivern: { nom: 'Hivern', icon: '❄️' } };
const TEMPS = { sol: { nom: 'Sol', icon: '☀️' }, nuvol: { nom: 'Ennuvolat', icon: '⛅' }, pluja: { nom: 'Pluja', icon: '🌧️' }, boira: { nom: 'Boira', icon: '🌫️' }, neu: { nom: 'Neu', icon: '🌨️' } };
function madridNow(d = new Date()) {
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(d);
  const g = t => +(parts.find(p => p.type === t) || {}).value;
  const y = g('year'), mo = g('month'), da = g('day'), h = g('hour') % 24, mi = g('minute');
  let off = (h + mi / 60) - (d.getUTCHours() + d.getUTCMinutes() / 60); if (off < -12) off += 24; if (off > 12) off -= 24;
  return { y, mo, da, h, mi, off };
}
function estacioDe(mo, da) { const md = mo * 100 + da; if (md >= 320 && md <= 620) return 'primavera'; if (md >= 621 && md <= 922) return 'estiu'; if (md >= 923 && md <= 1220) return 'tardor'; return 'hivern'; }

const PROB_TEMPS = { primavera: [['sol', .45], ['nuvol', .25], ['pluja', .2], ['boira', .1]], estiu: [['sol', .7], ['nuvol', .17], ['pluja', .1], ['boira', .03]], tardor: [['sol', .35], ['nuvol', .25], ['pluja', .25], ['boira', .15]], hivern: [['sol', .3], ['nuvol', .2], ['neu', .3], ['boira', .12], ['pluja', .08]] };
/* El temps canvia cada dia (el mateix per a tothom, perquè depèn de la data) */
function tempsDe(est, y, mo, da) { let r = hashStr('follia-' + y + '-' + mo + '-' + da), acc = 0; for (const [k, p] of PROB_TEMPS[est]) { acc += p; if (r < acc) return k; } return 'sol'; }
function solDe(t) { // sortida i posta aproximades a Madrid (hores locals)
  const doy = Math.round((Date.UTC(t.y, t.mo - 1, t.da) - Date.UTC(t.y, 0, 0)) / 864e5);
  const dayLen = 12.2 + 2.95 * Math.sin(2 * Math.PI * (doy - 80) / 365.25);
  const B = 2 * Math.PI * (doy - 81) / 364, eot = 0.165 * Math.sin(2 * B) - 0.126 * Math.cos(B) - 0.025 * Math.sin(B);
  const noon = 12.25 - eot + t.off; return { sortida: noon - dayLen / 2, posta: noon + dayLen / 2 };
}
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const hex2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixC = (a, b, t) => { const A = hex2(a), Bc = hex2(b); return '#' + A.map((v, i) => Math.round(v + (Bc[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const fmtHora = x => { const h = Math.floor(((x % 24) + 24) % 24), m = Math.round((x - Math.floor(x)) * 60) % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); };
function calcEnv(t, ov = {}) {
  const est = ov.estacio || estacioDe(t.mo, t.da);
  let temps = ov.temps || tempsDe(est, t.y, t.mo, t.da);
  if (temps === 'neu' && est !== 'hivern' && !ov.temps) temps = 'pluja';
  const { sortida, posta } = solDe(t);
  let hora = t.h + t.mi / 60;
  if (ov.hora === 'dia') hora = (sortida + posta) / 2; else if (ov.hora === 'posta') hora = posta - 0.15; else if (ov.hora === 'nit') hora = posta + 4;

function useEnv() {

/* La part visible de l'escena (en unitats SVG) s'encaixa entre el marcador de dalt i les dreceres de baix */
function useViewBox(insets) {
  const calc = () => {
    const W = window.innerWidth, H = window.innerHeight;
    const mob = W < 700 && H > W;
    const cb = mob ? { x: 112, y: 40, w: 926, h: 730 } : { x: -240, y: 18, w: 1732, h: 744 };
    const top = insets.t || 0, bot = insets.b || 0, avail = Math.max(120, H - top - bot);
    const s = Math.min(W / cb.w, avail / cb.h);
    const vw = W / s, vh = H / s;
    const x0 = cb.x + cb.w / 2 - vw / 2;
    const y0 = cb.y - (top + (avail - cb.h * s) / 2) / s;
    return `${x0.toFixed(1)} ${y0.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}`;
  };
  const [vb, setVb] = useState(calc);
  useEffect(() => { setVb(calc()); const h = () => setVb(calc()); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, [insets.t, insets.b]);
  return vb;
}

function mascotLines(data) {
  const out = [];
  const avui = data.bolos.filter(b => statusKey(b) === 'avui');
  avui.forEach(b => out.push('Avui toca bolo: ' + boloNom(b) + '! 🔥'));
  const next = data.bolos.filter(isUpcoming).sort(byDate)[0];
  if (next) out.push('Proper bolo: ' + boloNom(next) + (next.data ? ' (' + fmtDateL(next.data) + ')' : '') + ' ' + MOD[next.modalitat].icon);
  const perCob = data.bolos.filter(b => isDone(b) && !cobrat(b));
  if (perCob.length) out.push('Hi ha ' + perCob.length + ' bolos fets pendents de cobrar 💸');
  const passats = data.bolos.filter(b => statusKey(b) === 'passat');
  if (passats.length) out.push(passats.length + ' bolos ja han passat: confirma si es van fer ✅');
  const mat = data.items.filter(i => i.estat === 'perdut' || i.estat === 'reparacio');
  if (mat.length) out.push('Ep! Hi ha material perdut o en reparació 🔧');
  const errs = auditar(data).filter(x => x.nivell === 'error');
  if (errs.length) out.unshift('⛔ Hi ha ' + errs.length + ' errors als comptes: mira la Pissarra de l’Oficina');
  const av = avisosPendents(data.bolos);
  if (av.length) out.push('Tens ' + av.length + ' avisos per enviar als músics 📣 (Oficina › Bolos)');
  out.push('Toca la finestra de les golfes per veure qui som 👀');
  out.push('Les normes del grup són a la farola. Compte amb les multes! 📜');
  const deute = (data.grup.sancions || []).filter(x => !x.pagada).reduce((t, x) => t + num(x.import), 0);
  if (deute > 0) out.push('Hi ha ' + eur(deute) + ' de multes per pagar 😬');
  out.push('Segueix-nos a Instagram: @lafollia__ 📸');
  out.push('Hola! Benvinguts a l’Hotel La Follia 🎉');
  return out;
}

/* ---------- Factures (basades en els bolos, numeració única) ---------- */
function OfFactures({ openBolo }) {
  const { data, patch } = useApp();
  const [fy, setFy] = useState(String(new Date().getFullYear()));
  const fact = data.bolos.filter(b => b.numFactura && (!fy || (b.dataFactura || b.data || '').startsWith(fy))).sort((a, b) => String(b.dataFactura || '').localeCompare(String(a.dataFactura || '')) || String(b.numFactura).localeCompare(String(a.numFactura)));
  const senseFact = data.bolos.filter(b => isDone(b) && !historic(b) && !b.numFactura && (!fy || (b.data || '').startsWith(fy))).sort(byDate);
  const tot = fact.filter(b => !historic(b)).reduce((a, b) => { const c = calc(b); a.base += c.base; a.total += c.total; if (cobrat(b)) a.cob += c.total; else a.pen += c.total; return a; }, { base: 0, total: 0, cob: 0, pen: 0 });
  return (
    <div className="card">
      <div className="flex flex-wrap gap-2 items-center mb-3">
        <h2 className="m-0 flex-1">🧾 Factures</h2>
        <select className="inp" style={{ maxWidth: 150 }} value={fy} onChange={e => setFy(e.target.value)}><option value="">Tots els anys</option>{yearsOf(data.bolos).map(y => <option key={y}>{y}</option>)}</select>
        <span className="badge" style={{ background: '#fff', color: '#4a2f17' }}>Proper número: {nextInvoiceNumber()}</span>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
        <div className="kpi" style={{ background: '#5f6673' }}><i>📄</i><b>{eur(tot.base)}</b><span>Base imposable</span></div>
        <div className="kpi" style={{ background: '#2f80ed' }}><i>🧾</i><b>{eur(tot.total)}</b><span>Total facturat ({fact.length})</span></div>
        <div className="kpi" style={{ background: '#29a35a' }}><i>✅</i><b>{eur(tot.cob)}</b><span>Cobrat</span></div>
        <div className="kpi" style={{ background: '#e08a00' }}><i>⏳</i><b>{eur(tot.pen)}</b><span>Pendent de cobrar</span></div>
      </div>
      {senseFact.length > 0 && <div className="warn mb-3"><b>Bolos fets sense factura ({senseFact.length}):</b> <div className="flex flex-wrap gap-2 mt-2">{senseFact.map(b => <button key={b.id} className="btn-game sm ghost" onClick={() => openBolo(b, 'docs')}>{MOD[b.modalitat].icon} {fmtDate(b.data)} · {boloNom(b)}</button>)}</div></div>}
      <div className="overflow-x-auto">
        <table className="tbl">
          <thead><tr><th>Núm.</th><th>Data</th><th>Client</th><th>Bolo</th><th>Base</th><th>IVA</th><th>Ret.</th><th>Total</th><th>Venciment</th><th>Estat</th><th></th></tr></thead>
          <tbody>{fact.map(b => { const c = calc(b), cl = client(b.clientId); const venc = addDays(b.dataFactura, parseInt(b.diesVenciment) || 30); const vencuda = !cobrat(b) && venc < todayISO();
            return <tr key={b.id} className="row-click" onClick={() => openBolo(b, 'docs')}>
              <td className="font-extrabold whitespace-nowrap">{b.numFactura}</td><td className="whitespace-nowrap">{fmtDate(b.dataFactura)}</td><td>{cl ? cl.nom : '—'}</td><td className="text-xs">{MOD[b.modalitat].icon} {boloNom(b)}<br />{fmtDate(b.data)}</td>
              <td>{eur(c.base)}</td><td className="text-xs">{c.ivaPct}%<br />{eur(c.iva)}</td><td className="text-xs">{c.retPct}%<br />-{eur(c.ret)}</td><td className="font-extrabold">{eur(c.total)}</td><td className="whitespace-nowrap">{fmtDate(venc)}</td>
              <td>{cobrat(b) ? <span className="pill" style={{ background: '#7fd1a8' }}>Cobrada</span> : vencuda ? <span className="pill" style={{ background: '#f08a96' }}>Vençuda</span> : <span className="pill" style={{ background: '#ffd08a' }}>Pendent</span>}</td>
              <td onClick={e => e.stopPropagation()}><button className="qbtn" title={cobrat(b) ? 'Marcar pendent' : 'Marcar cobrada'} onClick={() => patch('bolos', b.id, x => cobrat(x) ? { cobrat: false } : { cobrat: true, dataCobrament: x.dataCobrament || todayISO() })}>{cobrat(b) ? '↩️' : '💰'}</button></td>
            </tr>; })}</tbody>
        </table>
        {!fact.length && <Empty icon="🧾" text="Encara no hi ha factures aquest any. Es generen des de la fitxa de cada bolo (Contracte i factura)." />}
      </div>
      <p className="text-xs opacity-70 font-bold mt-2">Total = base + IVA − retenció. Cada factura queda lligada al seu bolo: el número s’assigna una sola vegada. Revisa la numeració a ⚙️ Configuració si ja havíeu emès factures.</p>
    </div>
  );
}

  const set = k => e => setC(x => ({ ...x, [k]: e.target.value }));

  const onNom = () => { const n = normKey(c.nom); const hit = n && [...data.directori].find(x => normKey(x.nom) === n); if (hit) { fill(hit, false); toast('Dades omplertes des del directori'); } };
  const cifOk = c.cif ? validCifFormat(c.cif) : null;
  const [cerca, setCerca] = useState(false);
  const oficial = async () => { if (!c.nom.trim() && !c.poblacio) return toast('Escriu primer el nom (p. ex. Ajuntament de Linyola)'); setCerca(true); try { const o = await buscaMunicat(c.nom || c.poblacio); if (!o) toast('No s’ha trobat al registre oficial de Catalunya. Omple-ho a mà.'); else { setC(x => ({ ...x, cif: o.cif || x.cif, adreca: o.adreca || x.adreca, cp: o.cp || x.cp, poblacio: o.poblacio || x.poblacio, provincia: o.provincia || x.provincia, email: x.email || o.email, nom: x.nom || o.nom, fontDades: 'Municat' })); toast('Dades oficials omplertes ✔ (' + o.nom + ')'); } } catch (e) { toast('No s’ha pogut consultar el registre oficial ara mateix'); } setCerca(false); };

    const out = { ...c, fontDades: c.fontDades || 'manual', dataVerificacio: todayISO() };

      <div className="grid sm:grid-cols-2 gap-3">
        <Field label="Nom de l’entitat (Ajuntament…)"><input className="inp" list="dl_ent" value={c.nom} onChange={set('nom')} onBlur={onNom} autoFocus /></Field>
        <div className="sm:col-span-2 -mt-1"><button className="btn-game sm blue" disabled={cerca} onClick={oficial}>{cerca ? '⏳ Buscant…' : '🔎 Omplir amb les dades oficials (CIF, adreça…)'}</button> <span className="text-xs font-bold opacity-70">Registre d’ens locals de la Generalitat (Municat)</span></div>
        <Field label="CIF / NIF"><input className="inp" value={c.cif} onChange={set('cif')} />{cifOk !== null && <span className="text-xs font-bold" style={{ color: cifOk ? '#14894b' : '#c9302c' }}>{cifOk ? '✔ Format vàlid' : '✖ Format no vàlid'}</span>}</Field>

        <Field label="Representant (nom)"><input className="inp" value={c.representant} onChange={set('representant')} placeholder="Sr. Joan Pérez" /></Field>
        <Field label="Tractament"><input className="inp" value={c.tractamentRep} onChange={set('tractamentRep')} placeholder="Il·lm." /></Field>
        <Field label="Persona de contacte"><input className="inp" value={c.contacte} onChange={set('contacte')} /></Field>
        <Field label="Correu electrònic"><input className="inp" value={c.email} onChange={set('email')} /></Field>

        {mid && <><div className="overflow-x-auto mt-2"><table className="tbl"><thead><tr><th></th><th>Data</th><th>Bolo</th><th>Km</th><th>Import</th><th>Ja en dieta</th></tr></thead>
          <tbody>{cand.map(b => { const dc = dietaCalc(b), pv = dietesDeBolo(b.id); return <tr key={b.id}><td><input type="checkbox" style={{ width: 20, height: 20 }} checked={sel.includes(b.id)} onChange={() => setSel(s => s.includes(b.id) ? s.filter(x => x !== b.id) : [...s, b.id])} /></td><td>{fmtDate(b.data)}</td><td>{boloNom(b)}</td><td>{dc.pending ? <span className="opacity-60">sense km</span> : fmtKm(dc.totalKm) + ' km'}</td><td>{dc.pending ? '—' : eur(dc.cost)}</td><td className="text-xs">{pv.length ? pv.map(x => x.num).join(', ') : '—'}</td></tr>; })}</tbody></table>
          {!cand.length && <Empty icon="🔎" text="Cap bolo coincideix. Prova «Tots els bolos» o un altre any (i revisa l’assistència al quilometratge)." />}</div>
          <p className="font-bold mt-2">{sel.length} bolos seleccionats · Total estimat {eur(tot)}</p>
          <button className="btn-game teal" disabled={!sel.length} onClick={() => { const d = newDieta(mid, sel); upsert('dietes', d); setSel([]); setEdit(d.id); }}>＋ Crear dieta</button></>}
      </div>
      <div className="card">
        <h2>Dietes generades</h2>
        <div className="overflow-x-auto"><table className="tbl"><thead><tr><th>Núm.</th><th>Data</th><th>Perceptor</th><th>Km</th><th>Total</th><th>Estat</th></tr></thead>
          <tbody>{list.map(d => { const t = dietaTotals(d); return <tr key={d.id} className="row-click" onClick={() => setEdit(d.id)}><td className="font-extrabold">{d.num}</td><td>{fmtDate(d.data)}</td><td>{d.perceptor.nom}</td><td>{fmtKm(t.km)}</td><td>{eur(t.total)}</td><td><span className="pill" style={{ background: d.estat === 'Pagada' ? '#7fd1a8' : '#ffd08a' }}>{d.estat === 'Pagada' ? 'Pagada' : 'Pendent'}</span></td></tr>; })}</tbody></table>
          {!list.length && <Empty icon="💶" text="Encara no has creat cap dieta." />}</div>
      </div>
      {edit && <DietaEditor id={edit} onClose={() => setEdit(null)} />}
    </>
  );
}

/* ---------- Configuració ---------- */
function OfConfig() {
  const { data, setConfig, toast } = useApp();
  const [c, setC] = useState(() => JSON.parse(JSON.stringify(data.config)));
  const S = (grp, k, v) => setC(x => ({ ...x, [grp]: { ...x[grp], [k]: v } }));
  const I = (grp, k, label, type) => <Field label={label}><input className="inp" type={type || 'text'} value={c[grp][k] ?? ''} onChange={e => S(grp, k, type === 'number' ? (e.target.value === '' ? '' : num(e.target.value)) : e.target.value)} /></Field>;
  const onLogo = async e => { const f = e.target.files[0]; if (!f) return; try { const png = await toPngDataUrl(f, 400); S('grup', 'logo', png); } catch (err) { toast('No s’ha pogut llegir la imatge'); } };
  const save = () => { setConfig(() => ({ ...c, numeracio: { proxim: parseInt(c.numeracio.proxim) || 1, any: parseInt(c.numeracio.any) || new Date().getFullYear() }, km: { ...c.km, preuKm: num(c.km.preuKm) || 0.26, anadaTornada: c.km.anadaTornada === true || c.km.anadaTornada === 'true' }, fiscal: { ...c.fiscal, ivaDefault: num(c.fiscal.ivaDefault), retencioDefault: num(c.fiscal.retencioDefault), exempt: c.fiscal.exempt === true || c.fiscal.exempt === 'true' } })); toast('Configuració desada ✔'); };
  return (
    <>
      <div className="card mb-4"><h2>🏛️ Dades fixes del grup</h2>
        <div className="grid sm:grid-cols-3 gap-2">{I('grup', 'nom', 'Nom del grup')}{I('grup', 'nomFiscal', 'Nom fiscal')}{I('grup', 'nif', 'NIF / CIF')}{I('grup', 'representant', 'Representant')}{I('grup', 'carrec', 'Càrrec del representant')}{I('grup', 'adreca', 'Adreça fiscal')}{I('grup', 'cp', 'Codi postal')}{I('grup', 'poblacio', 'Població')}{I('grup', 'provincia', 'Província')}{I('grup', 'telefon', 'Telèfon')}{I('grup', 'email', 'Email')}{I('grup', 'iban', 'IBAN')}{I('grup', 'jutjats', 'Jutjats competents')}</div>
        <span className="lbl mt-3">Logo dels documents</span>
        <div className="flex items-center gap-3 flex-wrap"><img src={c.grup.logo || ASSETS.docLogo} alt="" style={{ height: 70, background: '#fff', borderRadius: 8, padding: 4 }} /><input type="file" accept="image/*" onChange={onLogo} />{c.grup.logo && <button className="btn-game sm ghost" onClick={() => S('grup', 'logo', '')}>Tornar al logo oficial</button>}</div>
      </div>
      <div className="card mb-4"><h2>🚗 Quilometratge</h2>
        <div className="grid sm:grid-cols-3 gap-2">{I('km', 'origen', 'Punt de sortida')}{I('km', 'preuKm', 'Preu per km (€)', 'number')}<Field label="Trajecte"><select className="inp" value={String(c.km.anadaTornada)} onChange={e => S('km', 'anadaTornada', e.target.value === 'true')}><option value="true">Anada + tornada</option><option value="false">Només anada</option></select></Field></div>
        <p className="text-xs opacity-70 font-bold">Els bolos ja tancats mantenen el preu i el trajecte que tenien en tancar-se.</p></div>
      <div className="card mb-4"><h2>🧾 Fiscal i numeració</h2>
        <div className="grid sm:grid-cols-3 gap-2">{I('fiscal', 'ivaDefault', 'IVA % per defecte', 'number')}{I('fiscal', 'retencioDefault', 'Retenció % per defecte', 'number')}<Field label="Exempt d’IVA per defecte"><select className="inp" value={String(c.fiscal.exempt)} onChange={e => S('fiscal', 'exempt', e.target.value === 'true')}><option value="true">Sí</option><option value="false">No</option></select></Field></div>
        <Field label="Text de l’exempció" className="mt-2"><textarea className="inp" value={c.fiscal.exempcioText} onChange={e => S('fiscal', 'exempcioText', e.target.value)} /></Field>
        <div className="grid sm:grid-cols-3 gap-2 mt-2">{I('numeracio', 'proxim', 'Pròxim número de factura', 'number')}{I('numeracio', 'any', 'Any de la numeració (canvia sol cada any)', 'number')}<Field label="Els comptes comencen el"><input className="inp" type="date" value={c.iniciComptes || '2027-01-01'} onChange={e => setC(x => ({ ...x, iniciComptes: e.target.value }))} /></Field><Field label="Data de factura per defecte"><select className="inp" value={c.dataFacturaMode} onChange={e => setC(x => ({ ...x, dataFacturaMode: e.target.value }))}><option value="posterior">Endemà del bolo</option><option value="actual">Data actual</option></select></Field></div>
        <p className="text-xs opacity-70 font-bold">Si ja havíeu emès factures amb el gestor antic, posa aquí el número que toca ara perquè no es repeteixin.</p></div>
      <button className="btn-game" onClick={save}>💾 Desar configuració</button>
    </>
  );
}


/* ---------- Pissarra d'ingressos i despeses (manual) ---------- */
const MOV_CATS = ['Bolo', 'Material', 'Transport', 'Menjar i beguda', 'Roba i marxandatge', 'Lloguer', 'Quotes', 'Multes del pot', 'Altres'];
function OfMoviments({ openBolo }) {
  const { data, setData, patch, upsert, remove, ask, toast } = useApp();
  const revisio = auditar(data);
  const grups = []; revisio.forEach(x => { let g = grups.find(y => y.codi === x.codi); if (!g) { g = { codi: x.codi, nivell: x.nivell, items: [] }; grups.push(g); } g.items.push(x); });
  const [veureAvisos, setVeureAvisos] = useState(true);
  const blank = () => ({ id: uid(), data: todayISO() < iniciComptes() ? iniciComptes() : todayISO(), tipus: 'despesa', concepte: '', import: '', categoria: '', nota: '' });
  const [f, setF] = useState(blank);
  const [fy, setFy] = useState(String(Math.max(new Date().getFullYear(), +iniciComptes().slice(0, 4) || 0))); const [fm, setFm] = useState(''); const [ft, setFt] = useState('');
  const editing = data.moviments.some(x => x.id === f.id);
  const set = k => e => setF(x => ({ ...x, [k]: e.target.value }));
  const save = () => { if (!f.concepte.trim()) return toast('Escriu el concepte'); if (!editing && f.tipus === 'ingres' && /bolo|actuaci/i.test(f.concepte)) toast('Recorda: els cobraments de bolos ja s’apunten sols en marcar el bolo com a cobrat. Comprova que no el dupliquis.'); if (!(num(f.import) > 0)) return toast('Posa un import més gran que 0'); upsert('moviments', { ...f, import: num(f.import) }); toast(editing ? 'Moviment actualitzat ✔' : (f.tipus === 'ingres' ? 'Ingrés apuntat 💰' : 'Despesa apuntada 🧾')); setF(blank()); };
  const anys = [...new Set([...data.moviments.map(x => (x.data || '').slice(0, 4)).filter(Boolean), String(new Date().getFullYear()), iniciComptes().slice(0, 4)])].filter(y => y >= iniciComptes().slice(0, 4)).sort().reverse();
  const list = data.moviments.filter(x => dinsComptes(x.data) && (!fy || (x.data || '').startsWith(fy)) && (!fm || (x.data || '').slice(5, 7) === fm) && (!ft || x.tipus === ft)).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const ing = list.filter(x => x.tipus === 'ingres').reduce((t, x) => t + num(x.import), 0), desp = list.filter(x => x.tipus === 'despesa').reduce((t, x) => t + num(x.import), 0);
  const totalSaldo = data.moviments.filter(x => dinsComptes(x.data)).reduce((t, x) => t + (x.tipus === 'ingres' ? 1 : -1) * num(x.import), 0);
  const expCSV = () => saveFile('moviments_' + (fy || 'tots') + '.csv', '﻿' + [['Data', 'Tipus', 'Concepte', 'Categoria', 'Import', 'Nota'], ...list.map(x => [fmtDate(x.data), x.tipus === 'ingres' ? 'Ingrés' : 'Despesa', x.concepte, x.categoria || '', (x.tipus === 'ingres' ? '' : '-') + num(x.import).toFixed(2).replace('.', ','), x.nota || ''])].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n'), 'text/csv');
  return (
    <>
      <div className={revisio.length ? 'warn mb-4' : 'info mb-4'}>
        <div className="flex items-center gap-2 flex-wrap"><b className="flex-1">{revisio.length ? '🔎 Revisió de comptes: ' + revisio.filter(x => x.nivell === 'error').length + ' errors i ' + revisio.filter(x => x.nivell === 'avis').length + ' avisos' : '✅ Tot quadra: bolos, factures, cobraments i pissarra estan concordats.'}</b>{revisio.length > 0 && <button className="btn-game sm ghost" onClick={() => setVeureAvisos(v => !v)}>{veureAvisos ? 'Amagar' : 'Veure'}</button>}</div>
        <p className="text-xs font-bold m-0 mt-1 opacity-80">Els cobraments de bolos, les dietes pagades i les multes pagades s’apunten sols a la pissarra (🔗). Si canvies l’import o la data al bolo, la pissarra s’actualitza; si desmarques el cobrament, l’apunt desapareix.</p>
        {veureAvisos && revisio.length > 0 && <div className="flex flex-col gap-2 mt-2">{grups.map((g, i) => g.items.length > 3 ? (
          <div key={i} className="rule" style={{ borderColor: g.nivell === 'error' ? '#f5b5b0' : '#ffd9a0', alignItems: 'flex-start' }}>
            <span className="ri">{g.nivell === 'error' ? '⛔' : '⚠️'}</span>
            <div className="flex-1 min-w-0"><div className="font-extrabold">{g.items.length} bolos amb el mateix avís: {g.items[0].titol.split(': ').slice(1).join(': ')}</div><div className="text-sm">{g.items[0].detall}</div>
              <div className="flex flex-wrap gap-1 mt-2">{g.items.map((x, k) => <button key={k} className="badge" style={{ background: '#fff', border: '1px solid #ecd9b8', cursor: 'pointer' }} onClick={() => x.bolo && openBolo && openBolo(x.bolo, x.codi === 'senseFactura' ? 'docs' : 'cobrament')}>{x.bolo ? boloNom(x.bolo) : x.titol}</button>)}</div>
              {g.codi === 'senseFactura' && <button className="btn-game sm ghost mt-2" onClick={() => ask('Marcar aquests ' + g.items.length + ' bolos com a «factura feta fora de l’app»? Deixaran de sortir en aquest avís.', () => setData(d => ({ ...d, bolos: d.bolos.map(b => g.items.some(x => x.bolo && x.bolo.id === b.id) ? { ...b, facturaExterna: true } : b) })))}>✔️ Totes es van fer fora de l’app</button>}
            </div>
          </div>) : g.items.map((x, k) => <div key={i + '-' + k} className="rule" style={{ borderColor: x.nivell === 'error' ? '#f5b5b0' : '#ffd9a0' }}>
          <span className="ri">{x.nivell === 'error' ? '⛔' : '⚠️'}</span>
          <div className="flex-1 min-w-0"><div className="font-extrabold">{x.titol}</div><div className="text-sm">{x.detall}</div></div>
          {x.codi === 'senseFactura' && x.bolo && <button className="btn-game sm ghost" onClick={() => patch('bolos', x.bolo.id, { facturaExterna: true })}>Feta fora</button>}
          {x.bolo && openBolo && <button className="btn-game sm teal" onClick={() => openBolo(x.bolo, x.codi === 'senseFactura' ? 'docs' : (cobrat(x.bolo) || isDone(x.bolo) ? 'cobrament' : 'dades'))}>📂 Arreglar</button>}
        </div>))}</div>}
      </div>
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
        <div className="kpi" style={{ background: '#29a35a' }}><i>💰</i><b>{eur(ing)}</b><span>Ingressos {fy || ''}{fm ? ' · ' + MESOS[+fm - 1] : ''}</span></div>
        <div className="kpi" style={{ background: '#e5484d' }}><i>🧾</i><b>{eur(desp)}</b><span>Despeses {fy || ''}{fm ? ' · ' + MESOS[+fm - 1] : ''}</span></div>
        <div className="kpi" style={{ background: totalSaldo >= 0 ? '#2f80ed' : '#a82d31' }}><i>🏦</i><b>{eur(totalSaldo)}</b><span>Saldo des del {fmtDate(iniciComptes())}</span></div>
      </div>
      <div className="card mb-4">
        <h2>{editing ? '✏️ Editar moviment' : '✍️ Apuntar un moviment'}</h2>
        <div className="seg mb-3"><button className={f.tipus === 'ingres' ? 'on' : ''} onClick={() => setF(x => ({ ...x, tipus: 'ingres' }))}>➕ Ingrés</button><button className={f.tipus === 'despesa' ? 'on' : ''} onClick={() => setF(x => ({ ...x, tipus: 'despesa' }))}>➖ Despesa</button></div>
        <div className="grid sm:grid-cols-[140px_1fr_130px_180px] gap-2">
          <Field label="Data"><input type="date" className="inp" value={f.data} onChange={set('data')} /></Field>
          <Field label="Què"><input className="inp" value={f.concepte} onChange={set('concepte')} placeholder={f.tipus === 'ingres' ? 'Ex.: Cobrament bolo Breda' : 'Ex.: Cordes de guitarra'} /></Field>
          <Field label="Quantitat (€)"><input type="number" step="0.01" min="0" className="inp" value={f.import} onChange={set('import')} /></Field>
          <Field label="Categoria"><input className="inp" list="movcats" value={f.categoria} onChange={set('categoria')} placeholder="Opcional" /><datalist id="movcats">{MOV_CATS.map(c => <option key={c} value={c} />)}</datalist></Field>
        </div>
        <Field label="Nota (opcional)" className="mt-2"><input className="inp" value={f.nota} onChange={set('nota')} /></Field>
        <div className="flex gap-2 mt-3"><button className={'btn-game ' + (f.tipus === 'ingres' ? '' : 'red')} onClick={save}>{editing ? '💾 Desar canvis' : f.tipus === 'ingres' ? '➕ Apuntar ingrés' : '➖ Apuntar despesa'}</button>{editing && <button className="btn-game ghost" onClick={() => setF(blank())}>Cancel·lar</button>}</div>
      </div>
      <div className="chalk">
        <div className="flex items-center gap-2 flex-wrap mb-3">
          <h2 className="m-0 flex-1" style={{ color: '#fff' }}>🧮 La pissarra dels comptes</h2>
          <select className="inp" style={{ maxWidth: 120 }} value={fy} onChange={e => setFy(e.target.value)}><option value="">Tots</option>{anys.map(y => <option key={y}>{y}</option>)}</select>
          <select className="inp" style={{ maxWidth: 130 }} value={fm} onChange={e => setFm(e.target.value)}><option value="">Tot l’any</option>{MESOS.map((n, i) => <option key={i} value={pad(i + 1)}>{n}</option>)}</select>
          <select className="inp" style={{ maxWidth: 130 }} value={ft} onChange={e => setFt(e.target.value)}><option value="">Tot</option><option value="ingres">Ingressos</option><option value="despesa">Despeses</option></select>
          <button className="btn-game sm ghost" onClick={expCSV}>⬇️ CSV</button>
        </div>
        {list.map(x => <div key={x.id} className="chalk-row">
          <span className="chalk-date">{fmtDate(x.data).slice(0, 5)}</span>
          <span className="flex-1 min-w-0"><b>{x.concepte}</b>{x.categoria && <span className="chalk-cat">{x.categoria}</span>}{x.nota && <small className="block opacity-70">{x.nota}</small>}</span>
          <span className={'chalk-imp ' + (x.tipus === 'ingres' ? 'in' : 'out')}>{x.tipus === 'ingres' ? '+' : '−'}{eur(x.import)}</span>
          {x.auto ? <>
            <span className="chalk-cat" title="Apunt automàtic">🔗 {x.auto === 'bolo' ? 'bolo' : x.auto === 'dieta' ? 'dieta' : 'multa'}</span>
            {x.auto === 'bolo' && openBolo && <button className="qbtn" title="Obrir el bolo" onClick={() => { const bb = data.bolos.find(y => y.id === x.refId); if (bb) openBolo(bb, 'cobrament'); }}>📂</button>}
            <button className="qbtn" title="Per què no es pot editar?" onClick={() => toast(x.auto === 'bolo' ? 'Aquest apunt surt del bolo: per canviar-lo, edita l’import o la data de cobrament a la fitxa, o desmarca el cobrament.' : x.auto === 'dieta' ? 'Aquest apunt surt de la dieta pagada: edita-la o marca-la com a pendent a Dietes.' : 'Aquest apunt surt d’una multa pagada: canvia-la a la farola de normes.')}>ℹ️</button>
          </> : <>
            <button className="qbtn" onClick={() => setF({ ...x, import: String(x.import) })} title="Editar">✏️</button>
            <button className="qbtn" onClick={() => ask('Esborrar «' + x.concepte + '»?', () => remove('moviments', x.id))} title="Esborrar">🗑️</button>
          </>}
        </div>)}
        {!list.length && <p className="m-0 opacity-80" style={{ fontFamily: 'Fredoka' }}>La pissarra està en blanc. Apunta el primer moviment! ✍️</p>}
        {list.length > 0 && <div className="chalk-row" style={{ borderBottom: 'none', marginTop: 6 }}><span className="flex-1"><b>Balanç del període</b></span><span className={'chalk-imp ' + (ing - desp >= 0 ? 'in' : 'out')}>{eur(ing - desp)}</span></div>}
      </div>
    </>
  );
}

/* ---------- Oficina: contenidor ---------- */
const OF_TABS = [['calendari', '🗓️', 'Calendari'], ['bolos', '🎶', 'Bolos'], ['pressupostos', '📝', 'Pressupostos'], ['contractes', '📜', 'Contractes'], ['factures', '🧾', 'Factures'], ['clients', '🏛️', 'Clients'], ['musics', '🎷', 'Músics'], ['km', '🚗', 'Quilometratge'], ['dietes', '💶', 'Dietes'], ['comptes', '🧮', 'Pissarra'], ['config', '⚙️', 'Configuració']];
function OficinaRoom() {
  const { data, officeTab: tab, setOfficeTab: setTab } = useApp();
  const [open, setOpen] = useState(null);
  const openBolo = (b, t) => setOpen({ b, tab: t || 'dades' });
  const counts = { comptes: auditar(data).filter(x => x.nivell === 'error').length, bolos: data.bolos.filter(b => statusKey(b) === 'passat').length + avisosPendents(data.bolos).length, factures: data.bolos.filter(b => isDone(b) && !cobrat(b)).length, contractes: data.bolos.filter(b => contractKey(b) === 'pendent' && isUpcoming(b)).length };
  return (
    <>
      <div className="otabs">{OF_TABS.map(([k, ic, t]) => <button key={k} className={'otab' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}><b>{ic}</b>{t}{counts[k] > 0 && <span className="badge" style={{ background: '#e5484d', color: '#fff', padding: '0 6px', fontSize: 11 }}>{counts[k]}</span>}</button>)}</div>
      {tab === 'calendari' && <OfCalendari openBolo={openBolo} />}
      {tab === 'bolos' && <OfBolos openBolo={openBolo} />}
      {tab === 'pressupostos' && <OfPressupostos openBolo={openBolo} />}
      {tab === 'contractes' && <OfContractes openBolo={openBolo} />}
      {tab === 'factures' && <OfFactures openBolo={openBolo} />}
      {tab === 'clients' && <OfClients />}
      {tab === 'musics' && <OfMusics />}
      {tab === 'km' && <OfKm />}
      {tab === 'dietes' && <OfDietes />}
      {tab === 'comptes' && <OfMoviments openBolo={openBolo} />}
      {tab === 'config' && <OfConfig />}
      {open && <BoloFitxa key={open.b.id + open.tab} bolo={open.b} tab0={open.tab} onClose={() => setOpen(null)} />}
    </>
  );
}

    Promise.all(noms.map(geoBusca)).then(() => { if (viu) setTick(t => t + 1); });
    return () => { viu = false; };
  }, [res.sense.length]);
  return res;
}

/* ---------- Dades oficials dels ajuntaments (Municat, Generalitat de Catalunya) ---------- */
const MUNICAT_URL = 'https://analisi.transparenciacatalunya.cat/resource/6nei-4b44.json';
const PROV_CP = { '08': 'Barcelona', '17': 'Girona', '25': 'Lleida', '43': 'Tarragona' };
const nomMunicipi = s => String(s || '').replace(/\([^)]*\)/g, '').replace(/^(ajuntament|ajunt\.?)\s+(de\s+|d'|d’|del\s+)?/i, '').replace(/^(l'|l’|el |la |els |les )/i, m => m).trim();
function pickKey(row, re, not) { return Object.keys(row).find(k => re.test(k) && !(not && not.test(k))); }
function rowToClient(row) {
  const g = re => { const k = pickKey(row, re); const v = k ? row[k] : ''; return typeof v === 'object' && v ? (v.human_address || v.url || '') : String(v || '').trim(); };
  const cp = g(/postal|^cp$|codi_p/i);
  const c = { nom: g(/^nom|denomin/i), cif: g(/nif|cif/i).toUpperCase().replace(/[^A-Z0-9]/g, ''), adreca: g(/adre|domicil|direcc/i), cp, poblacio: g(/municipi|localitat|poblaci/i), provincia: g(/provinc/i) || PROV_CP[String(cp).slice(0, 2)] || '', email: g(/mail|correu/i), tipus: g(/tipus|tipolog/i) };
  return c;
}
async function buscaMunicat(text) {
  const muni = nomMunicipi(text); if (!muni) return null;
  const url = MUNICAT_URL + '?$limit=60&$q=' + encodeURIComponent(muni);
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  const rows = await r.json(); if (!Array.isArray(rows) || !rows.length) return null;
  const nk = normNom(muni);
  const scored = rows.map(rowToClient).filter(c => c.cif || c.adreca).map(c => {
    let s = 0; const n = normNom(c.nom), p = normNom(c.poblacio), t = normNom(c.tipus);
    if (/^ajuntament/.test(n) || /municipi|ajuntament/.test(t)) s += 5;
    if (p === nk) s += 6; if (n.endsWith(nk)) s += 6; if (n.includes(nk)) s += 2;
    if (/consell|mancomun|consorci|entitat|organisme|empresa|fundaci|patronat/.test(n + t)) s -= 6;
    return { c, s };
  }).sort((a, b) => b.s - a.s);
  return scored[0] && scored[0].s >= 6 ? scored[0].c : null;
}

function NormesModal({ onClose }) {
  const { data, setData, ask, toast } = useApp();
  const normes = data.grup.normes || [], sancions = data.grup.sancions || [];
  const [tab, setTab] = useState('normes');
  const [ed, setEd] = useState(null);
  const [nova, setNova] = useState({ musicId: '', normaId: '', data: todayISO(), nota: '' });
  const G = fn => setData(d => ({ ...d, grup: { ...d.grup, ...fn(d.grup) } }));
  const normaById = id => normes.find(n => n.id === id);
  const musicNom = id => { const m = music(id); return m ? (m.nom + ' ' + (m.cognoms || '')).trim() : '?'; };
  const saveNorma = () => { if (!ed.norma.trim()) return toast('Escriu la norma'); G(g => ({ normes: (g.normes || []).some(n => n.id === ed.id) ? g.normes.map(n => n.id === ed.id ? { ...ed, import: num(ed.import) } : n) : [...(g.normes || []), { ...ed, import: num(ed.import) }] })); setEd(null); };
  const posar = () => {
    if (!nova.musicId || !nova.normaId) return toast('Tria qui i quina norma s’ha saltat');
    const n = normaById(nova.normaId);
    G(g => ({ sancions: [{ id: uid(), ...nova, import: n ? num(n.import) : 0, sancio: n ? n.sancio : '', pagada: false }, ...(g.sancions || [])] }));
    setNova(x => ({ ...x, musicId: '', nota: '' })); toast('Sanció apuntada ⚖️');
  };
  const ranking = data.musics.map(m => { const ss = sancions.filter(x => x.musicId === m.id); return { m, n: ss.length, deu: ss.filter(x => !x.pagada).reduce((t, x) => t + num(x.import), 0), total: ss.reduce((t, x) => t + num(x.import), 0) }; }).filter(r => r.n).sort((a, b) => b.n - a.n || b.total - a.total);
  const pot = sancions.filter(x => x.pagada).reduce((t, x) => t + num(x.import), 0);
  const deute = sancions.filter(x => !x.pagada).reduce((t, x) => t + num(x.import), 0);
  return (
    <Modal title="Normes i sancions de La Follia" icon="📜" onClose={onClose} wide>
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        {ASSETS.mascot && <img src={ASSETS.mascot} alt="" style={{ width: 84, animation: 'bobm 1.8s ease-in-out infinite' }} />}
        <p className="m-0 font-bold flex-1" style={{ minWidth: 200 }}>El codi de conducta oficial del grup. Qui se’l salta, paga! Les multes pagades s’apunten soles com a ingrés a la pissarra de l’Oficina 🫙</p>
        <div className="kpi" style={{ background: '#29a35a', minWidth: 130 }}><i>🫙</i><b>{eur(pot)}</b><span>Al pot</span></div>
        <div className="kpi" style={{ background: '#e5484d', minWidth: 130 }}><i>😬</i><b>{eur(deute)}</b><span>Per pagar</span></div>
      </div>
      <div className="ftabs" style={{ '--acc': '#e8457c' }}>
        <button className={'ftab' + (tab === 'normes' ? ' on' : '')} onClick={() => setTab('normes')}>📜 Normes ({normes.length})</button>
        <button className={'ftab' + (tab === 'sancions' ? ' on' : '')} onClick={() => setTab('sancions')}>⚖️ Sancions ({sancions.length})</button>
        <button className={'ftab' + (tab === 'pissarra' ? ' on' : '')} onClick={() => setTab('pissarra')}>🏆 Pissarra de la vergonya</button>
      </div>

      {tab === 'normes' && <>
        <div className="flex flex-col gap-2">
          {normes.map((n, i) => <div key={n.id} className="rule">
            <span className="ri">{n.icon || '⚠️'}</span>
            <div className="flex-1 min-w-0"><div className="font-extrabold">{i + 1}. {n.norma}</div><div className="text-sm" style={{ color: '#c9302c' }}>⚖️ {n.sancio}{num(n.import) ? ' · ' + eur(n.import) : ''}</div></div>
            <button className="qbtn" title="Editar" onClick={() => setEd({ ...n })}>✏️</button>
            <button className="qbtn" title="Eliminar" onClick={() => ask('Eliminar la norma «' + n.norma + '»?', () => G(g => ({ normes: g.normes.filter(x => x.id !== n.id) })))}>🗑️</button>
          </div>)}
        </div>
        {!normes.length && <Empty icon="📜" text="Encara no hi ha normes. Anarquia total!" />}
        <button className="btn-game sm pink mt-3" onClick={() => setEd({ id: uid(), icon: '⚠️', norma: '', sancio: 'Multa', import: 0 })}>＋ Nova norma</button>
        {ed && <div className="card mt-3" style={{ background: '#fff' }}>
          <div className="grid sm:grid-cols-[70px_1fr_1fr_110px] gap-2">
            <Field label="Icona"><input className="inp" value={ed.icon} onChange={e => setEd(x => ({ ...x, icon: e.target.value }))} maxLength={4} /></Field>
            <Field label="Norma"><input className="inp" value={ed.norma} onChange={e => setEd(x => ({ ...x, norma: e.target.value }))} placeholder="Ex.: Arribar 1 hora tard" autoFocus /></Field>
            <Field label="Sanció"><input className="inp" value={ed.sancio} onChange={e => setEd(x => ({ ...x, sancio: e.target.value }))} placeholder="Multa, paga una ronda…" /></Field>
            <Field label="Import (€)"><input type="number" step="0.5" min="0" className="inp" value={ed.import} onChange={e => setEd(x => ({ ...x, import: e.target.value }))} /></Field>
          </div>
          <div className="flex gap-2 mt-2"><button className="btn-game sm" onClick={saveNorma}>💾 Desar norma</button><button className="btn-game sm ghost" onClick={() => setEd(null)}>Cancel·lar</button></div>
        </div>}
      </>}

      {tab === 'sancions' && <>
        <div className="card mb-3" style={{ background: '#fff' }}>
          <h2>➕ Apuntar una sanció</h2>
          <div className="grid sm:grid-cols-4 gap-2">
            <Field label="Qui"><select className="inp" value={nova.musicId} onChange={e => setNova(x => ({ ...x, musicId: e.target.value }))}><option value="">Tria el culpable…</option>{data.musics.map(m => <option key={m.id} value={m.id}>{m.nom} {m.cognoms}</option>)}</select></Field>
            <Field label="Quina norma"><select className="inp" value={nova.normaId} onChange={e => setNova(x => ({ ...x, normaId: e.target.value }))}><option value="">Tria la norma…</option>{normes.map(n => <option key={n.id} value={n.id}>{n.icon} {n.norma}</option>)}</select></Field>
            <Field label="Data"><input type="date" className="inp" value={nova.data} onChange={e => setNova(x => ({ ...x, data: e.target.value }))} /></Field>
            <Field label="Nota (opcional)"><input className="inp" value={nova.nota} onChange={e => setNova(x => ({ ...x, nota: e.target.value }))} placeholder="Bolo, excusa…" /></Field>
          </div>
          <button className="btn-game sm red mt-2" onClick={posar}>⚖️ Posar sanció</button>
        </div>
        <div className="flex flex-col gap-2">
          {sancions.map(x => { const n = normaById(x.normaId); const m = music(x.musicId); return <div key={x.id} className="rule" style={x.pagada ? { opacity: .6 } : null}>
            {memberPhoto(m) ? <img src={memberPhoto(m)} alt="" className="thumb" style={{ borderRadius: '50%' }} /> : <span className="ri">🙈</span>}
            <div className="flex-1 min-w-0"><div className="font-extrabold">{musicNom(x.musicId)} · {n ? n.icon + ' ' + n.norma : 'Norma eliminada'}</div><div className="text-xs opacity-75">{fmtDate(x.data)} · {x.sancio}{num(x.import) ? ' · ' + eur(x.import) : ''}{x.nota ? ' · ' + x.nota : ''}</div></div>
            <button className={'btn-game sm ' + (x.pagada ? 'ghost' : 'orange')} onClick={() => G(g => ({ sancions: g.sancions.map(y => y.id === x.id ? { ...y, pagada: !y.pagada, dataPagament: !y.pagada ? todayISO() : '' } : y) }))}>{x.pagada ? '✅ Pagada' : 'Marcar pagada'}</button>
            <button className="qbtn" onClick={() => ask('Perdonar i esborrar aquesta sanció?', () => G(g => ({ sancions: g.sancions.filter(y => y.id !== x.id) })))}>🗑️</button>
          </div>; })}
        </div>
        {!sancions.length && <Empty icon="😇" text="Ningú s’ha saltat cap norma… de moment." />}
      </>}

      {tab === 'pissarra' && <div className="card" style={{ background: '#2f3b2f', color: '#fff', border: '8px solid #8a5228', fontFamily: 'Fredoka' }}>
        <h2 style={{ color: '#fff' }}>🏆 Pissarra de la vergonya</h2>
        {ranking.map((r, i) => <div key={r.m.id} className="shame" style={{ borderColor: 'rgba(255,255,255,.2)' }}>
          <span style={{ fontSize: 22, width: 30 }}>{['🥇', '🥈', '🥉'][i] || '😅'}</span>
          {memberPhoto(r.m) && <img src={memberPhoto(r.m)} alt="" style={{ width: 34, height: 34, borderRadius: '50%', objectFit: 'cover' }} />}
          <span className="flex-1 font-semibold">{r.m.nom} {r.m.cognoms}{i === 0 ? ' — 👑 Rei del desastre' : ''}</span>
          <span>{r.n} sancions</span><span style={{ width: 110, textAlign: 'right' }}>{r.deu ? 'deu ' + eur(r.deu) : 'al dia ✅'}</span>
        </div>)}
        {!ranking.length && <p className="m-0 opacity-80">La pissarra està neta. Tots uns àngels 😇</p>}
      </div>}
    </Modal>
  );
}

function MembresPanel() {
  const { data, toast, ask, user } = useApp();
  const [list, setList] = useState([]);
  const [email, setEmail] = useState(''); const [rol, setRol] = useState('lector');
  useEffect(() => fdb().collection('membres').onSnapshot(s => setList(s.docs.map(d => ({ email: d.id, ...d.data() })).sort((a, b) => a.email.localeCompare(b.email))), () => {}), []);
  const add = async (em, r) => { em = (em || '').trim().toLowerCase(); if (!/\S+@\S+\.\S+/.test(em)) return toast('Correu no vàlid'); await fdb().doc('membres/' + em).set({ rol: r, alta: todayISO() }, { merge: true }); };
  const musicsSense = data.musics.filter(m => hasEmail(m) && !list.some(x => x.email === m.email.trim().toLowerCase()));
  return (
    <div className="flex flex-col gap-2">
      <p className="text-sm m-0">Només poden entrar els correus d’aquesta llista (amb «Entrar amb Google»). <b>Consulta</b>: ho veuen tot però no poden canviar res. <b>Editor</b>: poden editar i veure dades personals i dietes. <b>Admin</b>: com editor i, a més, gestionen aquesta llista.</p>
      {musicsSense.length > 0 && <button className="btn-game sm teal" onClick={async () => { for (const m of musicsSense) await add(m.email, 'lector'); toast(musicsSense.length + ' músics afegits en mode consulta'); }}>＋ Donar accés de consulta als {musicsSense.length} músics amb correu</button>}
      <div className="flex gap-2 flex-wrap items-end">
        <Field label="Correu (Gmail)" className="flex-1"><input className="inp" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="nom@gmail.com" /></Field>
        <Field label="Permís"><select className="inp" value={rol} onChange={e => setRol(e.target.value)}><option value="lector">👀 Consulta</option><option value="editor">✏️ Editor</option><option value="admin">👑 Admin</option></select></Field>
        <button className="btn-game sm" onClick={async () => { await add(email, rol); setEmail(''); toast('Accés donat ✔'); }}>Afegir</button>
      </div>
      <div className="flex flex-col gap-1">{list.map(m => <div key={m.email} className="rule" style={{ padding: 6 }}>
        <span className="flex-1 font-bold text-sm truncate">{m.email}{m.email === (user.email || '').toLowerCase() ? ' (tu)' : ''}</span>
        <select className="inp" style={{ width: 130 }} value={m.rol} disabled={m.email === (user.email || '').toLowerCase()} onChange={e => fdb().doc('membres/' + m.email).set({ rol: e.target.value }, { merge: true })}><option value="lector">👀 Consulta</option><option value="editor">✏️ Editor</option><option value="admin">👑 Admin</option></select>
        {m.email !== (user.email || '').toLowerCase() && <button className="qbtn" onClick={() => ask('Treure l’accés a ' + m.email + '?', () => fdb().doc('membres/' + m.email).delete())}>🗑️</button>}
      </div>)}</div>
    </div>
  );
}
function DataModal({ onClose }) {
  const { data, replaceAll, ask, toast, role, user, sync, canEdit } = useApp();
  const [showJson, setShowJson] = useState(false);
  const [paste, setPaste] = useState('');
  const json = useMemo(() => { const { editedAt, ...rest } = data; return JSON.stringify(rest, null, 2); }, [data]);
  const importar = txt => {
    let d; try { d = JSON.parse(txt); } catch (e) { toast('El fitxer no és un JSON vàlid'); return; }
    if (!validData(d)) { toast('El JSON no té el format de l’Hotel La Follia (versió 2)'); return; }
    ask('Això substituirà totes les dades de l’app (per a tothom) per les importades. Continuar?', () => { replaceAll(d); toast('Dades importades ✔'); onClose(); });
  };
  const onFile = async e => { const f = e.target.files[0]; if (!f) return; importar(await f.text()); e.target.value = ''; };
  return (
    <Modal title="Dades i accessos" icon="⚙️" onClose={onClose} wide>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="flex flex-col gap-3">
          <div className="info">👤 Has entrat com <b>{user.email}</b> · permís: <b>{role === 'admin' ? '👑 Admin' : role === 'editor' ? '✏️ Editor' : '👀 Consulta'}</b><br />Estat: {sync === 'ok' ? '🟢 tot sincronitzat' : sync === 'saving' ? '⏳ desant…' : sync === 'offline' ? '📴 sense connexió (es desarà en tornar)' : '⚠️ hi ha hagut un error en desar'}.</div>
          <p className="text-sm m-0">Els canvis es desen sols al núvol i els veu tothom a l’instant. No cal prémer cap botó de desar.</p>
          <button className="btn-game ghost" onClick={signOut}>🚪 Tancar la sessió</button>
          <h3 className="font-semibold text-lg m-0 mt-2">⬇️ Còpia de seguretat</h3>
          <div className="flex gap-2 flex-wrap"><button className="btn-game blue" onClick={() => saveFile('hotel-la-follia-' + todayISO() + '.json', json, 'application/json')}>⬇️ Exportar JSON</button><button className="btn-game ghost" onClick={exportBolosCSV}>⬇️ Bolos CSV</button></div>
          {canEdit && <>
            <h3 className="font-semibold text-lg m-0 mt-2">⬆️ Importar (substitueix-ho tot)</h3>
            <input type="file" accept=".json,application/json" onChange={onFile} />
            <textarea className="inp" placeholder="…o enganxa aquí el JSON exportat" value={paste} onChange={e => setPaste(e.target.value)} style={{ fontFamily: 'monospace', fontSize: 11 }} />
            <button className="btn-game sm" disabled={!paste.trim()} onClick={() => importar(paste)}>Importar el text enganxat</button>
          </>}
        </div>
        <div className="flex flex-col gap-3 text-sm">
          {role === 'admin' ? <><h3 className="font-semibold text-lg m-0">🔑 Qui hi pot entrar</h3><MembresPanel /></> : <div className="info">Si necessites permís per editar, demana-ho a l’administrador del grup.</div>}
          <h3 className="font-semibold text-lg m-0 mt-2">📅 Avisos</h3>
          <div className="warn">Els avisos als músics encara s’envien des de la pestanya «📣 Avisos» de cada bolo (Gmail amb el missatge fet). L’enviament automàtic arribarà en una segona fase.</div>
        </div>
      </div>
    </Modal>
  );
}

function SetupScreen() {
  const { replaceAll, toast } = useApp();
  const [paste, setPaste] = useState('');
  const imp = txt => { let d; try { d = JSON.parse(txt); } catch (e) { return toast('El fitxer no és un JSON vàlid'); } if (!validData(d)) return toast('El JSON no té el format de l’Hotel La Follia'); replaceAll(d); toast('Dades importades ✔ Benvingut a l’hotel!'); };
  return <Splash>
    <p className="font-bold">L’hotel encara està buit. Porta-hi les dades de l’hotel antic de Claude:</p>
    <ol className="text-sm text-left" style={{ paddingLeft: 18, listStyle: 'decimal' }}><li>Obre l’hotel antic a Claude → ⚙️ Dades → «Exportar JSON» (o «Veure JSON» i copia’l).</li><li>Puja aquí el fitxer o enganxa el text.</li></ol>
    <input type="file" accept=".json,application/json" onChange={async e => { const f = e.target.files[0]; if (f) imp(await f.text()); }} className="mt-2" />
    <textarea className="inp mt-2" placeholder="…o enganxa aquí el JSON" value={paste} onChange={e => setPaste(e.target.value)} style={{ fontFamily: 'monospace', fontSize: 11 }} />
    <div className="flex gap-2 justify-center mt-2 flex-wrap"><button className="btn-game" disabled={!paste.trim()} onClick={() => imp(paste)}>⬆️ Importar</button><button className="btn-game ghost" onClick={() => replaceAll({ ...EMPTY(), ...seedMaterial() })}>Començar buit</button></div>
  </Splash>;
}

/* =====================================================================
   14. APP
   ===================================================================== */
const SCREENS = ['escenari', 'xaranga', 'material', 'oficina', 'quisom'];
const readHash = () => { try { const h = location.hash.replace('#', ''); return SCREENS.includes(h) ? h : 'hotel'; } catch (e) { return 'hotel'; } };

function App() {
  const [toastMsg, setToastMsg] = useState(null);
  const tRef = useRef(null);
  const toast = m => { if (m !== RO_MSG && Date.now() - (window.__roAt || 0) < 500) return; setToastMsg(m); clearTimeout(tRef.current); tRef.current = setTimeout(() => setToastMsg(null), 3600); };
  TOAST = toast;
  const auth = useAuth();
  const Toast = toastMsg && <div className="toast">{toastMsg}</div>;
  if (!FB_OK) return <Splash><div className="err">Falta la configuració de Firebase. Edita el fitxer <b>firebase-config.js</b> i enganxa-hi les dades del teu projecte.</div>{Toast}</Splash>;
  if (auth.loading) return <Splash><p className="font-bold">Carregant…</p></Splash>;
  if (!auth.user) return <Splash><p className="font-bold">Entra amb el teu compte de Google per accedir a l’agenda del grup.</p><button className="btn-game blue" onClick={signIn} style={{ fontSize: 18 }}>🔐 Entrar amb Google</button>{Toast}</Splash>;
  if (auth.denied || !auth.role) return <Splash><div className="warn">El correu <b>{auth.user.email}</b> encara no té accés. Demana a l’administrador del grup que l’afegeixi.</div><button className="btn-game ghost mt-3" onClick={signOut}>Entrar amb un altre compte</button>{Toast}</Splash>;
  return <Main auth={auth} toast={toast} Toast={Toast} />;
}

function Main({ auth, toast, Toast }) {
  const store = useStore(auth.role);
  const [screen, setScreen] = useState(readHash);
  const [officeTab, setOfficeTab] = useState('bolos');
  const [showData, setShowData] = useState(false);
  const [showNormes, setShowNormes] = useState(false);
  const [confirmState, setConfirm] = useState(null);
  useEffect(() => { const h = () => setScreen(readHash()); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
  const go = s => { setScreen(s); try { if (s === 'hotel') history.replaceState(null, '', location.pathname + location.search); else location.hash = s; } catch (e) {} };
  const ask = (msg, onYes) => setConfirm({ msg, onYes });
  const ctx = { ...store, role: auth.role, user: auth.user, ask, toast, go, officeTab, setOfficeTab, openData: () => setShowData(true), openNormes: () => setShowNormes(true) };
  if (!store.ready) return <Splash><p className="font-bold">Obrint les portes de l’hotel…</p></Splash>;
  return (
    <Ctx.Provider value={ctx}>
      <style>{CSS}</style>
      {store.empty && auth.role === 'admin' ? <SetupScreen /> : <>
        <HotelWorld onOpen={go} />
        {screen !== 'hotel' && (
          <RoomShell key={screen} room={screen} onBack={() => go('hotel')}>
            {screen === 'escenari' && <BolosRoom mod="escenari" />}
            {screen === 'xaranga' && <BolosRoom mod="xaranga" />}
            {screen === 'material' && <MaterialRoom />}
            {screen === 'oficina' && <OficinaRoom />}
            {screen === 'quisom' && <QuiSomRoom />}
          </RoomShell>
        )}
        {showData && <DataModal onClose={() => setShowData(false)} />}
        {showNormes && <NormesModal onClose={() => setShowNormes(false)} />}
      </>}
      {confirmState && (
        <Modal title="Confirmació" icon="🤔" onClose={() => setConfirm(null)}
          footer={<><button className="btn-game ghost" onClick={() => setConfirm(null)}>No</button><button className="btn-game red" onClick={() => { const f = confirmState.onYes; setConfirm(null); f(); }}>Sí, endavant</button></>}>
          <p className="font-bold text-lg m-0">{confirmState.msg}</p>
        </Modal>
      )}
      {Toast}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
